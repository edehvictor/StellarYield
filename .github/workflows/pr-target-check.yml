name: PR Target Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-main-targets:
    name: Close PRs targeting main
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Comment and close pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const marker = "This repository uses `dev` as the integration branch.";
            const body = [
              "Thanks for opening this pull request.",
              "",
              `${marker} Please reopen this work with \`dev\` as the base branch instead of \`main\`.`,
              "",
              "This PR is being closed automatically because it targets `main`."
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100
            });

            const alreadyCommented = comments.some((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body
              });
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              state: "closed"
            });
